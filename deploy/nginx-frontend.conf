# SchoolCore frontend — nginx configuration for the `schoolcore-frontend`
# container. Serves the Vite `dist/` build on port 80.
#
# Replaces the nginx image's default site. Copied to
# /etc/nginx/conf.d/default.conf at image build time.
#
# IMPORTANT nginx behaviour this file is written around:
# `add_header` directives in a `server` block are NOT inherited by a `location`
# block that declares its own `add_header`. Because the SPA fallback
# internally redirects to /index.html, and that location sets its own
# Cache-Control, the security headers would be silently dropped on every real
# page response. They are therefore repeated explicitly in each location that
# sets a header of its own.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- security headers (server default; see note above) --------------
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "DENY"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Do not advertise the server implementation.
    server_tokens off;

    # ---- healthcheck ------------------------------------------------------
    # Cheap, static, and never touches the SPA fallback.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        return 200 "ok\n";
    }

    # ---- hashed build assets: long cache ----------------------------------
    # Vite emits content-hashed filenames under /assets, so they are safe to
    # cache immutably.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- other static files ----------------------------------------------
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- SPA entrypoint: never long-cache --------------------------------
    # index.html must always be revalidated, otherwise clients would keep
    # loading a stale asset manifest after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    # ---- SPA fallback -----------------------------------------------------
    # Unknown paths are client-side routes (React Router), not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. a stray .env) even if one ever landed here.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;
}
